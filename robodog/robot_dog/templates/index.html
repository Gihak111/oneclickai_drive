<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Robot Dog</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body { font-family: sans-serif; margin: 16px; background: #fff; color: #222; }
  h2 { margin: 0 0 8px; }
  .row { display: flex; gap: 8px; align-items: center; margin: 6px 0; flex-wrap: wrap; }
  .center { justify-content: center; }
  .pad button { font-size: 20px; width: 60px; height: 48px; }
  .pad button.active { background: #ddd; }
  .act button { height: 36px; }
  .muted { color: #777; font-size: 12px; }
  #log { color: #555; font-size: 14px; min-height: 20px; }
</style>
</head>
<body>
<h2>Robot Dog 조종</h2>
<div class="row"><a href="/calibration">서보 캘리브레이션</a> | <a href="/motion">동작 만들기</a></div>

<img src="{{ url_for('video_feed') }}" style="max-width:100%;border:1px solid #ccc"
     onerror="this.style.display='none'; document.getElementById('cam-msg').innerText='카메라 연결 실패 (서버 로그 확인)';">
<div id="cam-msg" class="muted"></div>

<div class="row">
  ESP32: <b id="hw-status">확인 중</b> |
  CPU <span id="cpu_temp">0</span>°C |
  RAM <span id="ram_usage">0</span>% |
  IP <span id="ip_address">-</span> |
  지금: <b id="motion-status">대기</b>
</div>
<div class="row">
  <label>보행 속도 <input id="speed" type="number" step="0.001" min="0.001" max="0.02" value="0.005" style="width:80px" onchange="updateSpeed()"></label>
  <span class="muted">0.001 ~ 0.02 (기본 0.005, 서보 보호를 위해 0.02까지)</span>
</div>

<div class="row center pad" style="margin-top:12px">
  <button id="btnUp" onmousedown="press('arrowup')" onmouseup="release('arrowup')" onmouseleave="release('arrowup')"
          ontouchstart="event.preventDefault(); press('arrowup')" ontouchend="release('arrowup')" ontouchcancel="release('arrowup')">↑</button>
</div>
<div class="row center pad">
  <button id="btnLeft" onmousedown="press('arrowleft')" onmouseup="release('arrowleft')" onmouseleave="release('arrowleft')"
          ontouchstart="event.preventDefault(); press('arrowleft')" ontouchend="release('arrowleft')" ontouchcancel="release('arrowleft')">←</button>
  <button id="btnDown" onmousedown="press('arrowdown')" onmouseup="release('arrowdown')" onmouseleave="release('arrowdown')"
          ontouchstart="event.preventDefault(); press('arrowdown')" ontouchend="release('arrowdown')" ontouchcancel="release('arrowdown')">↓</button>
  <button id="btnRight" onmousedown="press('arrowright')" onmouseup="release('arrowright')" onmouseleave="release('arrowright')"
          ontouchstart="event.preventDefault(); press('arrowright')" ontouchend="release('arrowright')" ontouchcancel="release('arrowright')">→</button>
</div>

<div class="row center act" style="margin-top:12px">
  <button onclick="sendAction(1)">1 엎드리기</button>
  <button onclick="sendAction(2)">2 악수</button>
  <button onclick="sendAction(3)">3 점프</button>
  <button onclick="sendAction(4)">4 기립</button>
  <button onclick="emergencyStop()" style="color:#c00">■ 정지</button>
</div>
<div id="log" class="row center">W A S D 또는 방향키로 조종 · 숫자키 1~4 = 특수 동작 · 화살표 버튼은 누르는 동안 이동</div>
<div id="binding-info" class="row center muted"></div>

<script>
// 서버 통신: 순수 fetch (외부 CDN 없음)
function $(id) { return document.getElementById(id); }

function sendCommand(data) {
  return fetch('/api/command', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  }).catch(function () { setLog('서버 연결 실패', '#c00'); });
}

function postJson(url, data) {
  return fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data || {})
  });
}

function setLog(msg, color) {
  var el = $('log');
  el.innerText = msg;
  el.style.color = color || '#555';
}

// 상태 폴링: 연결 / 시스템 정보 / 지금 하는 일
function pollStatus() {
  fetch('/api/status').then(function (r) { return r.json(); }).then(function (d) {
    if (d.cpu_temp !== undefined) $('cpu_temp').innerText = d.cpu_temp;
    if (d.ram_usage !== undefined) $('ram_usage').innerText = d.ram_usage;
    if (d.ip_address !== undefined) $('ip_address').innerText = d.ip_address;
    var hw = $('hw-status');
    hw.innerText = d.hardware ? '연결됨' : '연결 안 됨';
    hw.style.color = d.hardware ? 'green' : '#c00';
    var ms = $('motion-status');
    if (d.playing) ms.innerText = '동작 재생: ' + d.motion + (d.loop ? ' (반복)' : '');
    else if (d.moving) ms.innerText = '보행 중';
    else ms.innerText = '대기';
  }).catch(function () {
    var hw = $('hw-status');
    hw.innerText = '서버 연결 안 됨';
    hw.style.color = '#c00';
  });
}
setInterval(pollStatus, 2000);
pollStatus();

// 화살표 키 바인딩 (동작 편집 페이지에서 할당): 'default' = 기본 보행, 그 외 = 동작 이름
var bindings = { arrowup: 'default', arrowdown: 'default', arrowleft: 'default', arrowright: 'default' };
var motionKeyActive = {};  // 화살표 키 -> {name, loop(null=서버 응답 대기 중), released}

function loadBindings() {
  fetch('/api/keybindings').then(function (r) { return r.json(); }).then(function (b) {
    bindings = b;
    showBindings();
  }).catch(function () { });
}

function showBindings() {
  var arrowNames = { arrowup: '↑', arrowdown: '↓', arrowleft: '←', arrowright: '→' };
  var parts = [];
  for (var k in arrowNames) {
    if (bindings[k] && bindings[k] !== 'default') parts.push(arrowNames[k] + ' = ' + bindings[k]);
  }
  $('binding-info').innerText = parts.length ? ('화살표 할당: ' + parts.join(', ')) : '';
}
loadBindings();
window.addEventListener('focus', loadBindings); // 편집 페이지에서 돌아오면 갱신

// 화살표 키에 할당된 반복 동작 정지 (이름을 같이 보내 그 동작이 재생 중일 때만 멈춘다)
function stopBoundMotion(name) {
  postJson('/api/motion/stop', { only_if_playing: true, motion: name }).catch(function () { });
}

// 조종: 키보드와 화면 버튼이 같은 press/release를 쓴다
var pressed = { w: false, s: false, a: false, d: false,
                arrowup: false, arrowdown: false, arrowleft: false, arrowright: false };
var padIds = { arrowup: 'btnUp', arrowdown: 'btnDown', arrowleft: 'btnLeft', arrowright: 'btnRight' };

function setPad(key, on) {
  var b = padIds[key] ? $(padIds[key]) : null;
  if (b) b.className = on ? 'active' : '';
}

function press(k) {
  if (!(k in pressed) || pressed[k] || motionKeyActive[k]) return;
  setPad(k, true);
  // 동작이 할당된 화살표 키: 보행 대신 해당 동작을 재생.
  // 반복 여부는 서버 응답(loop)으로 확정한다 — 브라우저가 가진 목록이 오래됐거나
  // 아직 안 왔어도 "뗄 때 멈출지"를 틀리지 않도록.
  if (k.indexOf('arrow') === 0 && bindings[k] && bindings[k] !== 'default') {
    var entry = { name: bindings[k], loop: null, released: false };
    motionKeyActive[k] = entry;
    postJson('/api/motions/' + encodeURIComponent(entry.name) + '/play', { hold: true })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.error) {
          if (motionKeyActive[k] === entry) delete motionKeyActive[k];
          setPad(k, false);
          setLog('동작 재생 실패: ' + d.error, '#c00');
          return;
        }
        entry.loop = !!d.loop;
        if (entry.released) {
          if (entry.loop) stopBoundMotion(entry.name);   // 응답 전에 이미 뗐음
        } else {
          setLog('동작 재생: ' + entry.name + (entry.loop ? ' (누르는 동안 반복)' : ' (한 번 재생, 끝나면 마지막 자세 유지)'), '#06c');
        }
      })
      .catch(function () {
        if (motionKeyActive[k] === entry) delete motionKeyActive[k];
        setPad(k, false);
        setLog('서버 연결 실패', '#c00');
      });
    return;
  }
  pressed[k] = true;
  postMove();
  setLog('이동: ' + describeMove(), 'green');
}

function release(k) {
  setPad(k, false);
  // 동작 재생 중이던 화살표 키: 반복 동작은 떼면 정지, 일반 동작은 끝까지 재생
  var entry = motionKeyActive[k];
  if (entry) {
    delete motionKeyActive[k];
    entry.released = true;
    if (entry.loop === null) return;          // 서버 응답이 오면 그때 판단
    if (entry.loop) {
      stopBoundMotion(entry.name);
      setLog('동작 정지: ' + entry.name);
    }
    return;
  }
  if (k in pressed && pressed[k]) {
    pressed[k] = false;
    postMove();
    var m = describeMove();
    setLog(m === '정지' ? '정지' : '이동: ' + m, m === '정지' ? '#555' : 'green');
  }
}

function describeMove() {
  var fb = (pressed.w || pressed.arrowup) ? 1 : ((pressed.s || pressed.arrowdown) ? -1 : 0);
  var lr = (pressed.a || pressed.arrowleft) ? -1 : ((pressed.d || pressed.arrowright) ? 1 : 0);
  var parts = [];
  if (fb === 1) parts.push('전진');
  if (fb === -1) parts.push('후진');
  if (lr === -1) parts.push('좌회전');
  if (lr === 1) parts.push('우회전');
  return parts.length ? parts.join(' + ') : '정지';
}

function postMove() {
  var fb = 0, lr = 0;
  if (pressed.w || pressed.arrowup) fb = 1;
  if (pressed.s || pressed.arrowdown) fb = -1;
  if (pressed.a || pressed.arrowleft) lr = -1;
  if (pressed.d || pressed.arrowright) lr = 1;
  sendCommand({ A: 1000, B: fb, C: lr });
}

document.addEventListener('keydown', function (e) {
  if (e.repeat) return; // 꾹 누르고 있을 때 연속 전송 방지
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT')) return;
  var k = e.key.toLowerCase();
  if (['1', '2', '3', '4'].indexOf(k) >= 0) { sendAction(parseInt(k)); return; }
  if (k in pressed) {
    if (k.indexOf('arrow') === 0) e.preventDefault(); // 방향키 스크롤 방지
    press(k);
  }
});
document.addEventListener('keyup', function (e) {
  var k = e.key.toLowerCase();
  if (k in pressed) release(k);
});

// 안전장치 1: 키를 누른 채 창이 비활성화되면 keyup을 못 받으므로 전부 해제하고 정지
function releaseAll() {
  var any = false;
  for (var k in pressed) {
    if (pressed[k]) { pressed[k] = false; any = true; }
    setPad(k, false);
  }
  for (var mk in motionKeyActive) {
    var entry = motionKeyActive[mk];
    entry.released = true;
    if (entry.loop !== false) stopBoundMotion(entry.name); // 반복이거나 아직 모르면 멈춘다
    delete motionKeyActive[mk];
    any = true;
  }
  if (any) { postMove(); setLog('창 비활성화 → 정지', '#c60'); }
}
window.addEventListener('blur', releaseAll);
document.addEventListener('visibilitychange', function () { if (document.hidden) releaseAll(); });

// 안전장치 2: 키를 누르고 있는 동안 1초마다 keep-alive. 서버는 3초(config.HOLD_TIMEOUT)
// 이상 끊기면(WiFi 끊김/브라우저 종료) 스스로 정지시킨다. move=이동, motion=반복 동작
function heldKinds() {
  var move = false, motion = false;
  for (var k in pressed) { if (pressed[k]) move = true; }
  for (var mk in motionKeyActive) { motion = true; }
  return { move: move, motion: motion };
}
setInterval(function () {
  var h = heldKinds();
  if (h.move || h.motion) postJson('/api/hold', h).catch(function () { });
}, 1000);

var actionNames = { 1: '엎드리기', 2: '악수', 3: '점프', 4: '기립' };
function sendAction(n) {
  sendCommand({ A: 1004, B: n });
  setLog('특수 동작: ' + (actionNames[n] || n), '#06c');
}

// 긴급 정지: 키 상태 초기화 + 이동 정지 + 재생 중 동작 중단 후 기립
function emergencyStop() {
  for (var k in pressed) { pressed[k] = false; setPad(k, false); }
  for (var mk in motionKeyActive) { motionKeyActive[mk].released = true; delete motionKeyActive[mk]; }
  sendCommand({ A: 1000, B: 0, C: 0 });
  postJson('/api/motion/stop', {}).catch(function () { });
  setLog('정지: 모든 동작을 멈추고 기립합니다', '#c60');
}

function updateSpeed() {
  var v = parseFloat($('speed').value);
  if (isNaN(v)) return;
  v = Math.max(0.001, Math.min(0.02, v));
  $('speed').value = v;
  sendCommand({ A: 3000, B: v });
  setLog('보행 속도: ' + v, '#06c');
}
</script>
</body>
</html>
